<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-container">
    <div class="modal-header">
      <button class="close-button" (click)="onClose()" aria-label="Close modal">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <div class="modal-content">
      <div class="newsletter-wrapper">
        <div class="signup">
          <div class="envelope-bg">
            <i class="far fa-envelope"></i>
          </div>
          <div class="hgroup">
            <h3>Welcome to DolphJS!</h3>
            <p>
              Subscribe to stay up to date with the latest Dolph updates, features, and
              videos!
            </p>
          </div>
          <div class="newsletter-form">
            <form
              class="form-wrapper"
              (submit)="addToNewsletter($event, email.value)"
            >
              <input
                id="newsletter-email"
                class="form-control"
                name="email"
                type="email"
                placeholder="Email address.."
                required
                [disabled]="isDisabled"
                #email
              />
              <button
                type="submit"
                class="signup-button"
                aria-label="Signup to Newsletter"
                [disabled]="isDisabled"
                [class.btn-success]="isEmailAdded"
              >
                <i class="far fa-paper-plane"></i>
                <i class="icon-success fas fa-check-circle"></i>
              </button>
            </form>
          </div>
          
          <div class="skip-section">
            <button class="skip-button" (click)="onClose()">
              Maybe later
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
